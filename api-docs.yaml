openapi: 3.0.1
info:
  title: API de Usuarios
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /usuarios/{id}:
    get:
      tags:
      - usuario-controller
      summary: Obtener un usuario por ID
      operationId: obtenerUsuario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Usuario"
    put:
      tags:
      - usuario-controller
      summary: Actualizar un usuario existente
      operationId: actualizarUsuario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Usuario"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Usuario"
    delete:
      tags:
      - usuario-controller
      summary: Eliminar un usuario por ID
      operationId: eliminarUsuario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /usuarios:
    get:
      tags:
      - usuario-controller
      summary: Obtener todos los usuarios
      operationId: obtenerTodosLosUsuarios
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
    post:
      tags:
      - usuario-controller
      summary: Crear un nuevo usuario
      operationId: crearUsuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Usuario"
        required: true
      responses:
        "400":
          description: Solicitud inválida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Usuario"
        "201":
          description: Usuario creado exitosamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Usuario"
components:
  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombres:
          type: string
        apellidos:
          type: string
        rut:
          type: integer
          format: int64
        dv:
          type: string
        fechaNacimiento:
          type: string
          format: date-time
        correoElectronico:
          type: string
        contrasena:
          type: string
